name: Bug report
description: Report broken behavior in The Folio
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not attach personal character backups or private notes."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include clear steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: "Chrome / Windows 11"
  - type: textarea
    id: logs
    attributes:
      label: Error message (without private data)
