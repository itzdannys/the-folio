name: Feature request
description: Suggest a new feature or quality-of-life improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What would this help you do at the table?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the interaction and expected rules behavior.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Character library
        - Character builder
        - Sheet / Combat
        - Spellbook / Rules
        - Weapons / Inventory
        - Journal
        - Appearance / Dice
        - Other
